<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
</head>
<body>
    
    <header class="cabeçalho app">
        <h1>Gerenciador de Tarefas</h1>
        <p class ="subtitle">Organize suas tarefas por prioridade, categoria e status</p>
    </header>

    <main class=""app-main>

        <section class="secao-formulario" aria-labelledby="titulo-formulario">
            <h2 id="titulo-formulario">Nova tarefa</h2>

            <form id="task-form" novalidate>
                <input type="hidden" id="task-id">


                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required max="120">
                    <span class="campo-error" id="erro-nome" role="alert"></span>
                </div>


                <div class="linha">
                    <div class="campo">
                        <label for="dataTermino">Data e hora de término</label>
                        <input type="datetime-local" id="dataTermino" name="dataTermino" required>
                        <span class="campo" id="erro-dataTermino" role="alert"></span>
                    </div>

                    <div class="campo campo-pequeno">
                        <label for="prioridade">Prioridade</label>
                        <select id="prioridade" name="prioridade" required>
                            <option value="">--</option>
                            <option value="1">1 (mais baixa)</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5 (mais alta)</option>
                        </select>
                        <span class="campo-error" id="erro-prioridade" role="alert"></span>
                    </div>
                </div>

                <div class="linha">
                    <div class="campo">
                        <label for="categoria">Categoria</label>
                        <input type="text" id="categoria" name="categoria" maxlength="60">
                    </div>

                    <div class="campo campo-pequeno">
                        <label for="status">Status</label>
                        <select name="status" id="status">
                            <option value="TODO">A fazer</option>
                            <option value="DOING">Em andamento</option>
                            <option value="DONE">Concluída</option>
                        </select>
                    </div>
                </div>

                <div class="acoes-formulario">
                    <button type="submit" id="btn-salvar">Salvar tarefa</button>
                    <button type="button" id="btn-cancelar", class="btn-secundario" hidden>Cancelar edição</button>
                </div>
            </form>
        </section>
        
        <section class="lista-section" aria-labelledby="lista-title">
            <div class="lista-header">
                <h2 id="lista-title">Tarefas</h2>

                <div class="filtro-status">
                    <label for="filtro-status">Filtrar por status</label>
                    <select id="filtro-status">
                        <option value="TODOS">Todos</option>
                        <option value="TODO">A fazer</option>
                        <option value="DOING">Em andamento</option>
                        <option value="DONE">Concluida</option>
                    </select>
                </div>
            </div>

            <table class="tarefa-tabela">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Término</th>
                        <th>Categoria</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tarefa-tbody">

                </tbody>
            </table>

            <p id="lista-vazia" class="lista-vazia" hidden>Nenhuma tarefa por aqui ainda. Crie a primeira no formulário acima.</p>
        </section>
    </main>

    <script></script>
</body>
</html>
